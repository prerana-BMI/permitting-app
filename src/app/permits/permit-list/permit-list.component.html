<div class="position-relative" style="height: 300px; background-image: url('assets/images/dataimg1-default.jpg'); background-size: cover; background-position: center;">
  <div class="row">
    <div class="col-md-12 h-100 align-items-center d-flex">
      
     
      <div class="col-md-8 text-white">
        <h2 style="font-size: 32px; font-weight: bold; text-shadow: 1px 1px 4px #faf3f3;">
          Looking For Something? 
        </h2>
        <h2 style="font-size: 32px; font-weight: bold; text-shadow: 1px 1px 4px #f7f4f4;">
          Let Us Help You...
        </h2>
        <p style="font-size: 20px; font-weight: bold; text-shadow: 1px 1px 4px #f7f4f4;">
          We make it easy to find exactly what you need.
        </p>
      </div>

      <!-- Right: Search Box (1/4 width) -->
<div class="col-md-4 p-4">
  <div class="p-3 bg-white shadow-sm rounded border">
    <div class="row align-items-center mb-2">
      <div class="col-4">
        <label for="city" class="form-label mb-0">City/County:</label>
      </div>
      <div class="col-8">
        <input type="text" class="form-control" id="city" placeholder="Enter City or County" />
      </div>
    </div>

    <div class="row align-items-center mb-2">
      <div class="col-4">
        <label for="state" class="form-label mb-0">State:</label>
      </div>
      <div class="col-8">
        <input type="text" class="form-control" id="state" placeholder="Enter State" />
      </div>
    </div>

    <div class="row align-items-center mb-2">
      <div class="col-4">
        <label for="country" class="form-label mb-0">Country:</label>
      </div>
      <div class="col-8">
        <input type="text" class="form-control" id="country" placeholder="Enter Country" />
      </div>
    </div>

    <div class="row justify-content-end mt-3">
      <div class="col-12">
        <button class="btn btn-primary w-100" (click)="Search()">Search</button>
      </div>
    </div>
  </div>
</div>


    </div>
  </div>
</div>
