<div class="col-md-12 rounded PageLayout" style="height:120px;">
  <div class="d-flex mt-2" [formGroup]="SearchForm">
    <div class="col-lg-3 col-md-3 col-sm-12 p-1">
      <div class="form-group">
        <label for="city" class="form-label labelClass lableSyle">
          Category
        </label>
      
        <select name="" id="" class="form-control custom-input" formControlName="Category">
          <option value="" >Select</option>
          <option value="{{i}}" *ngFor="let i of CategoryList">{{i}}</option>
        </select>
      </div>
    </div>
    <div class="col-lg-3 col-md-3 col-sm-12 p-1">
      <div class="form-group">
        <label for="city" class="form-label labelClass lableSyle">
          Permit Name
        </label>
       <input type="text" formControlName="PermitName" class="form-control custom-input" [matAutocomplete]="permitlist">
                      <mat-autocomplete #permitlist="matAutocomplete" [displayWith]="PermitTypeAheadDisplay.bind(this)">
                        <mat-option *ngIf="ispermitLoading">
                            <mat-spinner diameter="20" style="margin-left: 40%;" color="accent">
                            </mat-spinner>
                        </mat-option>
                        <mat-option class="mat-opt1" disabled>
                            <div>
                                <table>
                                    <tr class="tr">
                                        <td style="width: 200px;">Permit Name</td>
                    
                                    </tr>
                                </table>
                            </div>
                        </mat-option>
                        <mat-option *ngFor="let l of PermitNameList | slice:0:30" [value]="l.PermitName" class="mat-opt">
                            <div>
                                <table>
                                    <tr class="tr">
                                        <td >{{l.PermitName}}</td>
                    
                                    </tr>
                                </table>
                            </div>
                        </mat-option>
                        <mat-option *ngIf="PermitNameList.length == 0" disabled>
                            No Options
                        </mat-option>
                    </mat-autocomplete>
      </div>
    </div>
    <div class="col-lg-3 col-md-3 col-sm-12 p-1">
      <div class="form-group">
        <label for="city" class="form-label labelClass lableSyle">
          Regulatory Agency
        </label>
      <input type="text" class="form-control custom-input" formControlName="RegulatoryAgency" [matAutocomplete]="agencyLst">
      <mat-autocomplete #agencyLst="matAutocomplete" [displayWith]="AgencyTypeAheadDisplay.bind(this)">
        <mat-option *ngIf="isAgencyLoading">
          <mat-spinner diameter="20" style="margin-left: 40%;" color="accent">
          </mat-spinner>
        </mat-option>
        <mat-option class="mat-opt1" disabled>
          <div>
            <table>
              <tr class="tr">
                <td style="width: 200px;">Agency Name</td>
      
              </tr>
            </table>
          </div>
        </mat-option>
        <mat-option *ngFor="let l of RegagencyList | slice:0:30" [value]="l.Name" class="mat-opt">
          <div>
            <table>
              <tr class="tr">
                <td class="td td1">{{l.Name}}</td>
      
              </tr>
            </table>
          </div>
        </mat-option>
        <mat-option *ngIf="RegagencyList.length == 0" disabled>
          No Options
        </mat-option>
      </mat-autocomplete>
      </div>
      </div>

    <div class="col-lg-1 col-md-1 col-sm-12 mr-2">
      <!-- <div class="form-group"> -->

      <button class="btn btn-outline form-control d-flex align-items-center FlterButton custom-outline-btn"
        (click)="Search()">
        <span style=" margin: 0 1px;"></span>
        <i class="fas fa-search"></i>
        <span class="flex-grow-1 text-start">Search</span>

      </button>
      <!-- </div> -->
    </div>
    <div class="col-lg-1 col-md-1 col-sm-12">
      <button type="button" class="btn btn-outline form-control d-flex align-items-center FlterButton custom-outline-btn"
        (click)="Clear()">
        <span style=" margin: 0 1px;"></span>
        <i class="fa fa-eraser"></i>
        <span class="flex-grow-1 text-start">Clear</span>
      </button>
    
    </div>
    


  </div>
</div>

<div class="col-md-12 rounded PageLayout mt-4" style="height:550px;">
<div class="col-md-12 mt-3 d-flex justify-content-between align-items-center">
  
  <div class="d-flex align-items-center">
   
  <mat-form-field appearance="outline" class="mr-2" style="height: 75px;">
    <mat-label style="color: black;">State</mat-label>
    <input matInput placeholder="Placeholder" value="{{State}}">
 </mat-form-field>

 <mat-form-field appearance="outline"  style="height: 75px;">
    <mat-label style="color: black;">City</mat-label>
    <input matInput placeholder="Enter City" [(ngModel)]="City" (input)="OnValueChanges()" [matAutocomplete]="ctlist">
     <mat-autocomplete #ctlist="matAutocomplete"
                      [displayWith]="CityTypeAheadDisplay.bind(this)">
                      <mat-option *ngIf="isCityLoading">
                        <mat-spinner diameter="20" style="margin-left: 40%;" color="accent">
                        </mat-spinner>
                      </mat-option>
                      <mat-option class ="mat-opt1" disabled>
                        <div>
                          <table>
                            <tr class="tr">
                              <td  style="width: 200px;">City</td>
                             
                            </tr>
                          </table>
                        </div>
                      </mat-option>
                      <mat-option *ngFor="let l of CityList | slice:0:30" [value]="l.City"  class ="mat-opt" >
                        <div>
                          <table>
                            <tr class="tr">
                              <td class="td td1" style="width: 200px;">{{l.City}}</td>
                             
                            </tr>
                          </table>
                        </div>
                      </mat-option>
                      <mat-option *ngIf="CityList.length == 0" disabled>
                        No Options
                      </mat-option>
      </mat-autocomplete>
 </mat-form-field>

  </div>

  
  <div class="d-flex align-items-center mr-2">
    <!-- <mat-paginator 
      *ngIf="PermitList != null"
      [length]="dataCount"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageOption"
      (page)="paginatorevt($event)"
      #paginator>
    </mat-paginator> -->
    <div>
     
      <span class="badge px-2 py-1 mr-2 text-white" style="background-color: #1c4876;">
        Selected Count : {{ SelectedCount}}
      </span>
   
      <a class="btn btn-sm rounded-1 mr-2" style="border: 1px solid #1c4876; color: #1c4876;" title="View"
        (click)="ViewDetails()">
        <i class="far fa-eye"></i>
      </a>
    </div>

    <a class="btn btn-sm rounded-1 ms-2" style="border: 1px solid #1c4876;color: #1c4876;" (click)="DownloadExcel()" >
      <i class="fa-solid fa-download"></i>
    </a>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <div class="card-body">
      <div style="overflow-x: auto; padding-right: 14px;">
        <div class="table-wrapper" style="max-height: 300px; overflow-y: auto;">
          <table class="table table-hover m-0" style="table-layout: fixed; width: 100%;">
            <thead style="display: table; width: 100%; table-layout: fixed;">
              <tr style="background-color: #bbbbbb4d; border: 1px solid #e1dbdba6;">
                <th class="checkbox-cell" style="width: 5px;">
                  <input type="checkbox" class="big-checkbox" [(ngModel)]="SelecAll" (click)="SelectAll($event)">
                </th>
                <th style="width: 80px;">Permit</th>
                <th style="width: 150px;">Regulatory Agency</th>
                <th style="width: 60px;">Category</th>
                <th style="width: 60px;">Level</th>
              </tr>
            </thead>
          </table>
          <table class="table table-hover m-0" style="table-layout: fixed; width: 100%;">
            <tbody style="display: block; max-height: 300px; overflow-y: auto; width: 100%;">
              <tr *ngFor="let item of PermitList; let i = index"
                style="display: table; table-layout: fixed; width: 100%;">
                <td class="checkbox-cell" style="width: 5px;">
                  <input type="checkbox" class="big-checkbox" (change)="OnSingleChange($event, item.Id)"
                    [(ngModel)]="item.Ischecked">
                </td>
                <td style="width: 80px;">{{item.PermitName}}</td>
                <td style="width: 150px;">{{item.RegulatoryAgencyName}}</td>
                <td style="width: 60px;">{{item.Category}}</td>
                <td style="width: 60px;">{{item.Level}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>
</div>
  <div class="row">
    <div class="col-md-12 d-flex justify-content-end">
      <div class="col-lg-1 col-md-2 col-sm-4 p-1 mr-2">
        <button class="btn btn-outline form-control d-flex align-items-center FlterButton custom-outline-btn" style="margin-top: 0px;"
          (click)="CreateMatrix()">
          <span style=" margin: 0 1px;"></span>
          <i class="fa-solid fa-arrow-right"></i>
          <span class="flex-grow-1 text-start">Next</span>

        </button>
      </div>
    </div>
  </div>


</div>
