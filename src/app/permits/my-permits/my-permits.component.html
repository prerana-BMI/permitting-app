<div class="col-md-12 rounded PageLayout" style="height:120px;">
  <div class="d-flex mt-2" [formGroup]="SearchForm">
    <div class="col-lg-3 col-md-3 col-sm-12 p-1">
      <div class="form-group">
        <label for="city" class="form-label labelClass lableSyle">
          Matrix Name
        </label>
        <input type="text" id="city" class="form-control custom-input" formControlName="MatrixName">
      </div>
    </div>
   
    <div class="col-lg-3 col-md-3 col-sm-12 p-1 mr-4">
      <div class="form-group">
        <label for="city" class="form-label labelClass lableSyle">
         Client Name
        </label>
        <input type="text" class="form-control custom-input" formControlName="RegulatoryAgency" [matAutocomplete]="agencyLst">
                        <mat-autocomplete #agencyLst="matAutocomplete" [displayWith]="AgencyTypeAheadDisplay.bind(this)">
                        <mat-option *ngIf="isAgencyLoading">
                            <mat-spinner diameter="20" style="margin-left: 40%;" color="accent">
                            </mat-spinner>
                        </mat-option>
                        <mat-option class="mat-opt1" disabled>
                            <div>
                                <table>
                                    <tr class="tr">
                                        <td style=""> Client Name</td>
                    
                                    </tr>
                                </table>
                            </div>
                        </mat-option>
                        <mat-option *ngFor="let l of RegagencyList | slice:0:30" [value]="l.Id" class="mat-opt">
                            <div>
                                <table>
                                    <tr class="tr">
                                        <td class="td td1">{{l.Name}}</td>
                    
                                    </tr>
                                </table>
                            </div>
                        </mat-option>
                        <mat-option *ngIf="RegagencyList.length == 0" disabled>
                            No Options
                        </mat-option>
                    </mat-autocomplete>
      </div>
    </div>
    
    <div class="col-lg-1 col-md-1 col-sm-12 p-1 mr-2">
       <button class="btn btn-outline form-control d-flex align-items-center FlterButton custom-outline-btn"
        (click)="Search()">
        <span style=" margin: 0 1px;"></span>
        <i class="fas fa-search"></i>
        <span class="flex-grow-1 text-start">Search</span>

      </button>
    </div>
     <div class="col-lg-1 col-md-1 p-1 col-sm-12">
      <button type="button"
        class="btn btn-outline form-control d-flex align-items-center FlterButton custom-outline-btn"
        (click)="Search()">
        <span style=" margin: 0 1px;"></span>
        <i class="fa fa-eraser"></i>
        <span class="flex-grow-1 text-start">Clear</span>

      </button>

    </div>


  </div>
</div>

<div class="col-md-12 rounded PageLayout mt-4" style="height:500px;">
 <div class="col-md-12 mt-3 d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center">
  </div>
    <div class="d-flex align-items-center mr-2">
      <mat-paginator *ngIf="MatrixList != null" [length]="dataCount" [pageSize]="pageSize" [pageSizeOptions]="pageOption"
        (page)="paginatorevt($event)" #paginator>
      </mat-paginator>
    
    </div>
</div>
  <div class="row">
    <div class="col-md-12">
      <div class="card-body">
        <div class="table-responsive-md">
          <table class="table table-hover">
            <thead>
              <tr style="background-color: #bbbbbb4d; border: 1px solid #e1dbdba6;">
               
                <th style="width: 80px;">Matrix Name</th>
                <th style="width: 150px;">Client Name</th>
                <th style="width: 60px;">Type Of Project</th>
                <th style="width: 80px;">Permit Count</th>
                 <th style="width: 60px;">Action</th>

              </tr>
            </thead>
            <tbody class="">
              <tr *ngFor="let item of MatrixList; let i = index">
              
                <td>{{item.MatrixName}}</td>
                <td>{{item.ClientName}}</td>
                <td>{{item.TypeOfProject}}</td>

                <td>{{item.PermitCount}}</td>
                <td>
                  <a class="btn btn-sm rounded-1" style="border: 1px solid #1c4876; color: #1c4876;" title="View" (click)="ViewDetails(item.Id)">
                    <i class="far fa-eye"></i>
                  </a>
                </td>
              </tr>

            </tbody>
          </table>


        </div>
      </div>

    </div>

  </div>
  <!-- <mat-paginator *ngIf="PermitList != null" [length]="dataCount" [pageSize]="pageSize" style="margin-top: 10px;"
                [pageSizeOptions]='pageOption' (page)="paginatorevt($event)" #paginator></mat-paginator> -->
</div>
