<div class="add-edit-popuop">
    <div class="shadowed-panel">
        <div class="panel-header d-flex justify-content-between align-items-center">
            <h5> Selected Permits </h5>
            <div><i class="fa fa-times" aria-hidden="true" (click)="clear()"></i></div>
        </div>
        <div class="card-body">
           
            <div *ngFor="let category of permitCategories; let i = index" class="border-bottom py-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge px-2 py-1 mr-2 text-white" style="background-color: #1c4876;">
                            {{ category[0] }}
                        </span>
                        <a  class="text-muted small ml-1">
                            ({{ category[1].length }} permits)
                        </a>
                    </div>
                    <i class="fa" [ngClass]="category.expanded ? 'fa-chevron-up' : 'fa-chevron-down'"
                        (click)="toggleCategory(i)" style="cursor:pointer;"></i>
                </div>

                <!-- Expanded Table -->
                <div *ngIf="category.expanded" class="mt-3">
                    <table class="table table-bordered table-sm">
                        <thead class="thead-light">
                            <tr>
                                 <th></th>
                                <th>Permit Name</th>
                                <th>Level</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let permit of category[1]">
                                <td class="checkbox-cell" style="width: 5px;">
                                    <input type="checkbox" class="big-checkbox"  [(ngModel)]="permit.Ischecked"
                                    (change)="OnSingleChange($event, category[0] , permit.Id)">
                                </td>
                                <td>{{ permit.PermitName }}</td>
                                <td>{{ permit.Level }}</td>

                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    

</div>
</div>
