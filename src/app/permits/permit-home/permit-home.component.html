<div class="page-container">

  <!-- Map Section (Left) -->
  <div class="map-section">
  <app-map [selectedLocationsFromParent]="selectedLocations" (citySelected)="handleCitySelected($event)"></app-map>

  </div>

  <!-- Sidebar Section (Right) -->
  <div class="sidebar-section">

    <!-- Top Card: Search Filters -->
    <div class="sidebar-card">
      <div class="panel-header">Search Locations</div>
      <div class="card-body" [formGroup]="SearchForm">
        <mat-form-field appearance="outline">
          <mat-label>State</mat-label>
          <input matInput type="text" placeholder="Enter State" formControlName="state" [matAutocomplete]="statelist" oninput="this.value = this.value.toUpperCase()">
          <mat-autocomplete #statelist="matAutocomplete" [displayWith]="StateTypeAheadDisplay.bind(this)">
            <mat-option *ngIf="isStateLoading"><mat-spinner diameter="20"></mat-spinner></mat-option>
            <mat-option  class ="mat-opt" *ngFor="let l of StateList | slice:0:30" [value]="l.State">{{l.State}} - US</mat-option>
            <mat-option *ngIf="!StateList || StateList.length === 0" disabled>No states found</mat-option>
          </mat-autocomplete>
          <mat-error *ngIf="SearchForm.get('state')?.hasError('notInList')">
            Please select a valid state from list
          </mat-error>
        </mat-form-field>

         <mat-form-field appearance="outline">
          <mat-label>County</mat-label>
          <input matInput type="text" placeholder="Enter County" formControlName="county" [matAutocomplete]="countylst" oninput="this.value = this.value.toUpperCase()">
          <mat-autocomplete #countylst="matAutocomplete" [displayWith]="CountyTypeAheadDisplay.bind(this)">
            <mat-option *ngIf="isCountyLoading"><mat-spinner diameter="20"></mat-spinner></mat-option>
            <mat-option  class ="mat-opt" *ngFor="let l of CountyList | slice:0:30" [value]="l.State">{{l.State}} - US</mat-option>
            <mat-option *ngIf="!CountyList || CountyList.length === 0" disabled>No County found</mat-option>
          </mat-autocomplete>
          <mat-error *ngIf="SearchForm.get('county')?.hasError('notInList')">
            Please select a valid county from list
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>City</mat-label>
          <input matInput type="text" placeholder="Enter City" formControlName="city" [matAutocomplete]="ctlist" oninput="this.value = this.value.toUpperCase()">
          <mat-autocomplete #ctlist="matAutocomplete" [displayWith]="CityTypeAheadDisplay.bind(this)">
            <mat-option *ngIf="isCityLoading"><mat-spinner diameter="20"></mat-spinner></mat-option>
            <mat-option  class ="mat-opt" *ngFor="let l of CityList | slice:0:30" [value]="l.City">{{l.City}}</mat-option>
            <mat-option *ngIf="!CityList || CityList.length === 0" disabled>No cities found</mat-option>
          </mat-autocomplete>
          <mat-error *ngIf="SearchForm.get('city')?.hasError('notInList')">
            Please select a valid city from list
          </mat-error>
        </mat-form-field>

        

        <button class="btn w-100 add-location-btn" (click)="AddToList()">
          <i class="fas fa-plus-circle ml-2"></i> Add Location
        </button>
      </div>
    </div>

    <!-- Bottom Card: Selected Locations (Enhanced UI) -->
    <div class="sidebar-card selected-locations-card" *ngIf="groupedLocationsByStates && groupedLocationsByStates.length > 0">
      <div class="panel-header">Selected Locations</div>
      <div class="card-body">
        <div *ngFor="let group of groupedLocationsByStates" class="state-card">
          <div class="state-card-header">
            <span class="state-badge">{{ group.state }}</span>
            <button class="remove-btn" title="Remove all cities in {{ group.state }}" (click)="removeState({ State: group.state, Selected: 'N' })">&times;</button>
          </div>
          <hr *ngIf="group.cities.length > 0">
          <div class="city-tags" *ngIf="group.cities.length > 0">
            <span *ngFor="let city of group.cities" class="city-tag">
              {{ city }}
              <button class="remove-btn" title="Remove {{city}}" (click)="removeCity({ City: city, State: group.state, Selected: 'N' })">&times;</button>
            </span>
          </div>
        </div>
      
      
           <button class="btn w-100 add-location-btn" (click)="Search()" >
          <i class="fas fa-search me-2"></i>Search Permits
           </button>
     </div>
    </div>

  </div>

</div>
