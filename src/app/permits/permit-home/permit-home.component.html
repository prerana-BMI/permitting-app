<div class="col-md-12 rounded PageLayout position-relative" style="height:110px;">
 <div class="d-flex mt-4" [formGroup]="SearchForm">
    <div class="col-lg-3 col-md-3 col-sm-12 p-1 mr-3">
        
<input type="text" class="form-control custom-input lableSyle" placeholder="Enter State"   formControlName="state"
        placeholder="Enter State"  [matAutocomplete]="statelist"
        oninput="this.value = this.value.toUpperCase()" >
        <mat-autocomplete #statelist="matAutocomplete" [displayWith]="StateTypeAheadDisplay.bind(this)">
          <mat-option *ngIf="isStateLoading">
            <mat-spinner diameter="20" style="margin-left: 40%;" color="accent">
            </mat-spinner>
          </mat-option>
          <mat-option class="mat-opt1" disabled>
            <div>
              <table>
                <tr class="tr">
                  <td style="width: 200px;">State</td>
                </tr>
              </table>
            </div>
          </mat-option>
          <mat-option *ngFor="let l of StateList | slice:0:30" [value]="l.State" class="mat-opt">
            <div>
              <table>
                <tr class="tr">
        
                  <td class="td td1" style="width: 200px;">{{l.State}} - US</td>
                </tr>
              </table>
            </div>
          </mat-option>
          <mat-option *ngIf="StateList.length == 0" disabled>
            No Options
          </mat-option>
        </mat-autocomplete>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 p-1 mr-3">
       <input type="text" class="form-control custom-input lableSyle" placeholder="Enter City" 
        oninput="this.value = this.value.toUpperCase()" 
         formControlName="city"  [matAutocomplete]="ctlist">
         <mat-autocomplete #ctlist="matAutocomplete"
                      [displayWith]="CityTypeAheadDisplay.bind(this)">
                      <mat-option *ngIf="isCityLoading">
                        <mat-spinner diameter="20" style="margin-left: 40%;" color="accent">
                        </mat-spinner>
                      </mat-option>
                      <mat-option class ="mat-opt1" disabled>
                        <div>
                          <table>
                            <tr class="tr">
                              <td  style="width: 200px;">City</td>
                             
                            </tr>
                          </table>
                        </div>
                      </mat-option>
                      <mat-option *ngFor="let l of CityList | slice:0:30" [value]="l.City"  class ="mat-opt" >
                        <div>
                          <table>
                            <tr class="tr">
                              <td class="td td1" style="width: 200px;">{{l.City}}</td>
                             
                            </tr>
                          </table>
                        </div>
                      </mat-option>
                      <mat-option *ngIf="CityList.length == 0" disabled>
                        No Options
                      </mat-option>
        </mat-autocomplete>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 p-1">
        <button type="button" class="btn btn-outline form-control d-flex align-items-center custom-outline-btn FlterButton" (click)="Search()">
          <span style=" margin: 0 1px;"></span>
          <i class="fas fa-search"></i>
          <span class="flex-grow-1 text-start">Search</span>
        </button>

    
    </div>
  </div>

</div>
<div class="row d-flex mt-5" >
    <div class="col-12 col-xl-8 mb-4">
      <div class="map-container">
        <app-map [selectedLocationsFromParent]="selectedLocations" (citySelected)="handleCitySelected($event)"></app-map>
      </div>
    </div>
      <div class="col-12 col-xl-2">
        <div class="container">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              Selected States
            </div>
            <div class="card-body p-0">
              <table class="table table-bordered table-hover mb-0">
                <tbody>
                  <tr *ngFor="let state of selectedStates; let i = index">
                    <td>
                      <span class="badge bg-light text-dark px-2 py-1 rounded-pill">
                        {{ state.State }}
                        <span class="text-danger ms-2 fw-bold cursor-pointer"  (click)="removeState(state)">
                          &times;
                        </span>
                      </span>
                    </td>
                  </tr>
      
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

         <div class="col-12 col-xl-2">
        <div class="container">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              Selected Cities
            </div>
            <div class="card-body p-0">
              <table class="table table-bordered table-hover mb-0">
                <tbody>
                  <tr *ngFor="let state of selectedCities; let i = index">
                    <td>
                      <span class="badge bg-light text-dark px-2 py-1 rounded-pill">
                        {{ state.City }}
                        <span class="text-danger ms-2 fw-bold cursor-pointer" (click)="removeCity(state)">
                          &times;
                        </span>
                      </span>
                    </td>
                  </tr>
      
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    


  </div>
