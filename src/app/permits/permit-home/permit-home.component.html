<div class="col-md-12 rounded PageLayout position-relative" style="height:110px;">
 <div class="d-flex mt-4" [formGroup]="SearchForm">
    <div class="col-lg-3 col-md-3 col-sm-12 p-1 mr-3">
        <input type="text" class="form-control custom-input lableSyle" placeholder="Enter City" 
        oninput="this.value = this.value.toUpperCase()" 
         formControlName="city"  [matAutocomplete]="ctlist">
         <mat-autocomplete #ctlist="matAutocomplete"
                      [displayWith]="CityTypeAheadDisplay.bind(this)">
                      <mat-option *ngIf="isCityLoading">
                        <mat-spinner diameter="20" style="margin-left: 40%;" color="accent">
                        </mat-spinner>
                      </mat-option>
                      <mat-option class ="mat-opt1" disabled>
                        <div>
                          <table>
                            <tr class="tr">
                              <td  style="width: 200px;">City</td>
                              <td  style="width: 200px;">State</td>
                            </tr>
                          </table>
                        </div>
                      </mat-option>
                      <mat-option *ngFor="let l of CityList | slice:0:30" [value]="l" class ="mat-opt" >
                        <div>
                          <table>
                            <tr class="tr">
                              <td class="td td1" style="width: 200px;">{{l.name}}</td>
                              <td class="td td1" style="width: 200px;">{{l.state}}</td>
                            </tr>
                          </table>
                        </div>
                      </mat-option>
                      <mat-option *ngIf="CityList.length == 0" disabled>
                        No Options
                      </mat-option>
        </mat-autocomplete>
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 p-1 mr-3">
        <input type="text" class="form-control custom-input lableSyle" placeholder="State - Country"   formControlName="state">
       
      </div>
      <div class="col-lg-3 col-md-3 col-sm-12 p-1">
        <button type="button" class="btn btn-outline form-control d-flex align-items-center custom-outline-btn FlterButton" >
          <span style=" margin: 0 1px;"></span>
          <i class="fas fa-search"></i>
          <span class="flex-grow-1 text-start">Search</span>
        </button>

    
    </div>
  </div>

</div>
<div class="row d-flex mt-5">
    
      <div class="col-12 col-xl-8 mb-4">
        <div class="map-container">
          <app-map></app-map>
        </div>
      </div>
      <div class="col-12 col-xl-4 mb-4">
        <div class="card border-10 rounded-0">
          <div class="card-title mb-1 p-3 d-flex">
            <h5>Join Us</h5>
            <a class="btn ml-auto p-0 text-lightning"> <i class="fas fa-ellipsis"></i> </a>
          </div>
          <div class="card-body">
            <p>Be a part of something big. Find your next job and build your story at Burns & McDonnell
              <a target="_blank" href="https://www.burnsmcd.com/careers"><i class="fa fa-arrow-circle-right"></i></a>
              <br>
            </p>
          </div>
        </div>
      </div>
  </div>
