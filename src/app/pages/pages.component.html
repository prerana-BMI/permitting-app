<nb-layout>
  <nb-layout-header fixed>
    <ngx-header></ngx-header>
  </nb-layout-header>

  <nb-sidebar class="menu-sidebar" tag="menu-sidebar">
    <nb-menu [items]="menu"></nb-menu>
    <ng-content select="nb-menu"></ng-content>
  </nb-sidebar>

  <nb-layout-column style="background-color: #fcfcfd;">
    <nav class="breadcrumb-container" aria-label="breadcrumb" style="margin-bottom: 15px;">
      <ol class="breadcrumb custom-breadcrumb">
        <li *ngFor="let crumb of breadcrumbItems; let last = last"
            class="breadcrumb-item"
            [class.active]="last">
          <a [class.disabled]="last">
            {{ crumb }}
          </a>
        </li>
      </ol>
    </nav>
    <router-outlet></router-outlet>
  </nb-layout-column>

  <nb-layout-footer fixed>
    <ngx-footer></ngx-footer>
  </nb-layout-footer>
</nb-layout>
