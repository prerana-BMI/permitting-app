<div class="add-edit-popuop">
  <div class="shadowed-panel" [formGroup]="AddUserForm">
    <div class="panel-header d-flex justify-content-between align-items-center">
      <h5> Add / Edit User </h5>
      <i class="fa fa-times" aria-hidden="true" (click)="clear()"></i>
    </div>

    <div class="panel-body">
      <div class="form-group">
        <label for="username" class="form-label labelClass lableSyle">User Name</label>
        <input type="text" id="username" class="form-control custom-input" formControlName="UserName" placeholder="Enter user name">
      </div>

      <div class="form-group">
        <label for="role" class="form-label labelClass lableSyle">User Role</label>
        <select id="role" class="form-control custom-input" formControlName="UserRole">
          <option value="">Select Role</option>
          <option value="Admin">Admin</option>
          <option value="User">User</option>
          <option value="Editior">Editior</option>
          
        </select>
      </div>

      <div class="form-group d-flex align-items-center">
        <label class="form-label labelClass lableSyle mb-0 mr-3">Active Status</label>
        <label class="switch">
          <input type="checkbox" formControlName="ActiveStatus">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="panel-footer">
        <button class="btn btn-primary submit-btn" (click)="Submit()">
            <i class="fas fa-save mr-2"></i>Submit
        </button>
    </div>
  </div>
</div>
