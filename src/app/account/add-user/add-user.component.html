<div class="add-edit-popuop">
    <div class="shadowed-panel" [formGroup]="AddUserForm">
        <div class="panel-header d-flex justify-content-between align-items-center">
            <h5> Add / Edit User </h5>
            <div><i class="fa fa-times" aria-hidden="true" (click)="clear()"></i></div>
        </div>
        <div class="row">
            <div class="col-md-12 p-3">

                <div class="col-md-12">
                    <div class="form-group">
                        <label for="username" class="form-label labelClass lableSyle">User Name</label>
                        <input type="text" id="username" class="form-control custom-input" formControlName="UserName">
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="form-group">
                        <label for="role" class="form-label labelClass lableSyle">User Role</label>
                        <select id="role" class="form-control custom-input" formControlName="UserRole">
                            <option value="">Select</option>
                            <option value="Admin">Admin</option>
                            <option value="User">User</option>
                        </select>
                    </div>
                </div>

                <!-- Active Status -->
                <div class="col-md-12">
                     <div class="form-group d-flex">
                        <label for="active" class="form-label labelClass lableSyle mr-4">Active Status</label>
                    <label class="switch">
                        <input type="checkbox" formControlName="ActiveStatus">
                        <span class="slider"></span>
                    </label>
                </div>
                </div>

            </div>
        </div>
    </div>

    <div class="col-md-12">
        <div class="row justify-content-center">
            <div class="col-sm-4 pr-2" style="margin-top: -80px;">
                <button class="btn btn-outline form-control d-flex align-items-center FlterButton custom-outline-btn" (click)="Submit()">
                    <span style=" margin: 0 1px;"></span>
                    <i class="fas fa-save"></i>
                    <span class="flex-grow-1 text-start">Submit</span>
                </button>
            </div>
        </div>
    </div>


</div>
